<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Polysil · No connection</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; color: #1c1917; background: #fafaf9; }
      @media (prefers-color-scheme: dark) { body { color: #f5f5f4; background: #1c1917; } }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 15px; line-height: 1.5; margin: 0 0 16px; }
      button { min-height: 44px; padding: 0 20px; font-size: 15px; border-radius: 8px; border: 1px solid currentColor; background: transparent; color: inherit; }

  <body>
    <h1>Polysil can't be reached</h1>
    <p>Check the phone's internet. If you're on duty, tracking carries on and the points wait on the phone until the connection is back.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </body>
</html>
