# Smoke · The app opens on the client's site, with the real logo, the name "Polysil Sarthi" and the sign-in form.
appId: com.polysil.crm
tags: [smoke]
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 45000
- assertVisible: "Your Digital Business Partner" # APP-013 · the tagline under "Polysil Sarthi"
- assertVisible: "Polysil Irrigation" # the logo's alternative text
- takeScreenshot: 01-launch
