# Every app's checks, defined in one place.
#
# Nothing triggers this workflow directly. pull-request.yml, after-merge.yml and
# nightly.yml call it and say how much to run. docs/CI-CD.md explains the setup.

name: Checks

on:
  workflow_call:
    inputs:
      scope:
        description: "changed = only the apps the change touches; all = every app in the repository."
        type: string
        default: changed
      slow-suites:
        description: Also run the slower frontend suites (Storybook accessibility and Playwright).
        type: boolean
        default: true
      ref:
        description: Branch or commit to check out. Empty means the commit that triggered the run.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  changes:
    name: Find the apps to check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      backend: ${{ steps.detect.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Compare with the target branch or the previous commit
        id: detect
        env:
          SCOPE: ${{ inputs.scope }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          has_frontend=false
          has_backend=false
          if [ -f Frontend/package.json ]; then has_frontend=true; fi
          if [ -f backend/pyproject.toml ]; then has_backend=true; fi

          # The commit to compare with. Empty means every app is checked.
          base=""
          if [ "$SCOPE" = "changed" ]; then
            case "$EVENT" in
              pull_request)
                # A pull request is checked out as a merge commit; its first parent is the target branch.
                base="HEAD^1"
                ;;
              push)
                if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                  base="$BEFORE"
                fi
                ;;
            esac
          fi

          if [ -z "$base" ]; then
            frontend=$has_frontend
            backend=$has_backend
            echo "Checking every app in the repository."
          else
            changed_files=$(git diff --name-only "$base" HEAD)
            echo "Changed files:"
            echo "$changed_files"
            frontend=false
            backend=false
            # A change under .github/ can break any app's checks, so it checks every app.
            if grep -qE '^(Frontend/|\.github/)' <<< "$changed_files"; then frontend=$has_frontend; fi
            if grep -qE '^(backend/|\.github/)' <<< "$changed_files"; then backend=$has_backend; fi
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          {
            echo "### Apps checked in this run"
            echo ""
            echo "| App | Checked |"
            echo "| --- | --- |"
            echo "| Frontend (\`Frontend/\`) | $frontend |"
            echo "| Backend (\`backend/\`) | $backend |"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend-checks:
    name: "Frontend: checks and build"
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Frontend
    env:
      HUSKY: "0"
      NEXT_TELEMETRY_DISABLED: "1"
      # The feature environment: mocked API, no secrets needed.
      NEXT_PUBLIC_APP_ENV: feature
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # The changelog check compares a pull request with its target branch.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: Frontend/.nvmrc
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Unit and component tests
        run: npm test

      - name: Unused files, exports and dependencies
        run: npm run knip

      - name: This pull request has a changelog entry
        # Dependabot can't write entries. When an update changes behaviour, the reviewer adds one.
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm run changelog:check -- --base "origin/$BASE_REF"

      - name: Changelog entries are valid
        if: github.event_name != 'pull_request' || github.actor == 'dependabot[bot]'
        run: npm run changelog:check

      - name: CHANGELOG.md is up to date
        run: npm run changelog:build -- --check

      - name: Production build
        run: npm run build

  frontend-storybook:
    name: "Frontend: Storybook accessibility"
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && inputs.slow-suites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Frontend
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: Frontend/.nvmrc
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Render every story and check it for accessibility violations
        run: npm run test:storybook

  frontend-e2e:
    name: "Frontend: Playwright smoke tests"
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && inputs.slow-suites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Frontend
    env:
      HUSKY: "0"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_ENV: feature
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: Frontend/.nvmrc
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build and start the app with the mocked API, then test it
        run: npm run test:e2e

      - name: Keep the Playwright report when tests fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: Frontend/playwright-report/
          retention-days: 7

  backend-lint:
    name: "Backend: lint and types"
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install the backend with its development tools
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      # CLAUDE.md 4.2 puts mypy --strict on these two packages and only these two.
      # The rest of the tree is not clean and saying so here is better than a green
      # tick that means less than it looks like it does.
      - name: Mypy, strict, on the domain and the services
        run: mypy --strict api/domain api/services

  backend-tests:
    name: "Backend: tests"
    needs: changes
    # Three containers and the whole suite, so it follows the same draft rule as
    # the slower frontend suites: push freely on a draft, get the full run when
    # the pull request is marked ready. After-merge and nightly always run it.
    if: needs.changes.outputs.backend == 'true' && inputs.slow-suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    # The same three containers the local stack runs, and PgBouncer is not
    # optional (ADR-021, ADR-023). The suite's whole point is that a claim set with
    # a plain SET instead of set_config(..., true) leaks to whoever borrows the
    # connection next, and that only fails against a real transaction-mode pooler.
    # A direct connection here would pass every test and prove nothing.
    services:
      postgres:
        image: postgres:16
        env:
          # `postgres`, not `appuser`. POSTGRES_USER creates a **superuser**, and a
          # superuser bypasses RLS unconditionally - even on a table with FORCE ROW
          # LEVEL SECURITY. Running the suite as one would enforce no policy at all
          # and pass every security test vacuously, which is the worst possible way
          # for this particular suite to be green.
          #
          # So the superuser is `postgres` and the application's `appuser` is made
          # below as an ordinary login role, which is what it is on every real
          # cluster. Caught by the reference SQL check, which is why it runs before
          # pytest.
          POSTGRES_USER: postgres
          # Local to this runner, thrown away when the job ends. Not a secret and
          # not worth pretending to be one.
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
        ports:
          - 5432:5432

      pgbouncer:
        image: edoburu/pgbouncer:v1.25.2-p0
        env:
          DB_HOST: postgres
          DB_PORT: 5432
          DB_USER: appuser
          DB_PASSWORD: ci-postgres
          DB_NAME: appdb
          LISTEN_PORT: 6432
          LISTEN_ADDR: 0.0.0.0
          POOL_MODE: transaction
          AUTH_TYPE: scram-sha-256
          MAX_CLIENT_CONN: 200
          DEFAULT_POOL_SIZE: 25
          IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
        options: >-
          --health-cmd "nc -z 127.0.0.1 6432 || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 20
        ports:
          - 6432:6432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
        ports:
          - 6379:6379

    env:
      # Through PgBouncer, always. Alembic rewrites the driver to psycopg itself.
      DATABASE_URL: postgresql+asyncpg://appuser:ci-postgres@127.0.0.1:6432/appdb
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      DB_APP_ROLE: app_role
      DB_ANON_ROLE: app_anon
      ENVIRONMENT: local

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install the backend with its development tools
        run: python -m pip install -e ".[dev]"

      # Roles are cluster objects and a migration is per-database, so CREATE ROLE
      # in a migration would fail on the second database in the same cluster. It is
      # an out-of-band step everywhere, including here.
      #
      # Direct to Postgres, not through the pooler: this is the one thing in the
      # whole setup that is not application traffic.
      - name: Create the login role, the database and the cluster roles
        env:
          PGPASSWORD: ci-postgres
        run: |
          psql -h 127.0.0.1 -p 5432 -U postgres -d postgres \
            -c "CREATE ROLE appuser LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD 'ci-postgres';" \
            -c "CREATE DATABASE appdb OWNER appuser;" \
            -c "CREATE ROLE app_role NOLOGIN;" \
            -c "CREATE ROLE app_anon NOLOGIN;" \
            -c "GRANT app_role TO appuser;" \
            -c "GRANT app_anon TO appuser;"

      # NOSUPERUSER above is the whole point, so it is asserted rather than
      # assumed: a superuser here would silently disable every policy in the suite.
      - name: The application role is not a superuser
        env:
          PGPASSWORD: ci-postgres
        run: |
          super=$(psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -tAc \
            "SELECT rolsuper FROM pg_roles WHERE rolname = 'appuser'")
          echo "appuser rolsuper = $super"
          if [ "$super" != "f" ]; then
            echo "::error title=RLS would not be enforced::appuser is a superuser, so every row-level policy is bypassed and the security tests would pass without enforcing anything."
            exit 1
          fi

      # scripts/seed_demo.py reads these three from infra/.env and nowhere else.
      - name: Write the environment file the seed reads
        run: |
          umask 077
          printf 'DB_USER=appuser\nDB_PASSWORD=ci-postgres\nDB_NAME=appdb\n' > infra/.env

      - name: Migrate
        run: alembic upgrade head

      # Roles, the permission matrix parsed from RBAC.md, and the administrator.
      # The parity suite builds its own rows, but the API tests sign in as a seeded
      # user and the product fixtures need a coded state to hang a district off.
      - name: Seed
        run: python scripts/seed_demo.py

      - name: The reference SQL still describes this database
        run: python scripts/validate_reference_sql.py

      # Everything. What the client's workbooks feed - the three golden subsidy
      # quotations and the loaded product catalogue - skips on its own, because
      # those files are not in this repository on purpose. The run prints what it
      # skipped and why.
      - name: Pytest
        # -ra, not -rs. `-rs` reports skips and *replaces* the default failure
        # summary, so the first failing run said what it skipped and not what it
        # failed, and the names had to be dug out of the raw log.
        run: pytest -q -p no:cacheprovider -ra

  ci-passed:
    name: CI passed
    needs: [changes, frontend-checks, frontend-storybook, frontend-e2e, backend-lint,
            backend-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check that ran passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          if jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' <<< "$RESULTS" > /dev/null; then
            echo "::error::A check failed or was cancelled. Open that job for details."
            exit 1
          fi
          echo "Every check that ran passed. Skipped checks had nothing to check."
