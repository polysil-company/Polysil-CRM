# TRK-008 · The Android tracking app (mobile/).
#
# - On a pull request that touches mobile/: lint, unit tests and a debug APK.
# - On demand (Actions → Android APK → Run workflow): a signed release APK,
#   polysil-tracking-<version>.apk, attached to the run as an artifact and published as a
#   GitHub Release (tag android-v<version>) to download from the repo's Releases page.
#
# The release keystore and its passwords live only in GitHub secrets and the owner's
# password manager, never in the repository:
#   POLYSIL_KEYSTORE_BASE64   the .jks file, base64-encoded
#   POLYSIL_KEYSTORE_PASSWORD
#   POLYSIL_KEY_ALIAS
#   POLYSIL_KEY_PASSWORD

name: Android APK

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      server-url:
        description: "The web app the APK opens (https). Empty means the staging web app."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build a debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Capacitor
        run: npm ci

      - name: Copy the config and plugins into the Android project
        env:
          CAP_SERVER_URL: ${{ inputs.server-url }}
        run: npx cap sync android

      - name: Lint, unit tests and the debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon lint test assembleDebug

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-reports
          path: |
            mobile/android/app/build/reports/
            mobile/android/app/build/test-results/
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: polysil-tracking-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  release:
    name: Signed release APK
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only this job writes: it publishes the APK as a release. Pull request builds stay read only.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Capacitor
        run: npm ci

      - name: Copy the config and plugins into the Android project
        env:
          CAP_SERVER_URL: ${{ inputs.server-url }}
        run: npx cap sync android

      - name: Restore the keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.POLYSIL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::POLYSIL_KEYSTORE_BASE64 is not set; add the release keystore to the repository secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/polysil-release.jks"

      - name: Build the signed release APK
        working-directory: mobile/android
        env:
          POLYSIL_KEYSTORE_FILE: ${{ runner.temp }}/polysil-release.jks
          POLYSIL_KEYSTORE_PASSWORD: ${{ secrets.POLYSIL_KEYSTORE_PASSWORD }}
          POLYSIL_KEY_ALIAS: ${{ secrets.POLYSIL_KEY_ALIAS }}
          POLYSIL_KEY_PASSWORD: ${{ secrets.POLYSIL_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name it polysil-tracking-<version>.apk
        id: name
        run: |
          version=$(grep -oE 'versionName "[^"]+"' android/app/build.gradle | sed -E 's/versionName "([^"]+)"/\1/')
          cp android/app/build/outputs/apk/release/app-release.apk "polysil-tracking-${version}.apk"
          echo "file=polysil-tracking-${version}.apk" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Forget the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/polysil-release.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.file }}
          path: mobile/${{ steps.name.outputs.file }}
          retention-days: 90

      # One release per version. Its APK is named for the site it opens, so a build for the test
      # site never replaces the client's. Building the same version again replaces that APK.
      - name: Publish it as a release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.name.outputs.version }}
          FILE: ${{ steps.name.outputs.file }}
          SERVER_URL: ${{ inputs.server-url }}
        run: |
          host=$(printf '%s' "${SERVER_URL:-staging}" | sed -E 's#^https?://##; s#/.*$##')
          asset="polysil-tracking-${VERSION}-${host}.apk"
          cp "$FILE" "$asset"
          tag="android-v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" \
              --target "$GITHUB_SHA" \
              --title "Polysil app ${VERSION}" \
              --notes "Android APK ${VERSION}, built from \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}) by run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}.

          Each APK is named for the site it opens. Download the one for your site, open it on the phone, and allow installing from this source. Phones with an older version update in place."
          fi
          echo "::notice::Released ${asset} as ${tag}"
