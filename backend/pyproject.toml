[project]
name = "polysil-crm"
version = "0.1.0"
description = "CRM, dealer portal and field sales backend for Polysil Irrigation Systems"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "arq>=0.26",
    "redis>=5.0",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "structlog>=24.4",
    "python-multipart>=0.0.9",
    # FS-005: the quotation PDF (ADR-024) and its store (ADR-026). One image serves
    # the API and the worker, so both are core dependencies.
    "jinja2>=3.1",
    "weasyprint>=62",
    "boto3>=1.35",
]

[project.optional-dependencies]
docs = ["openpyxl>=3.1"]
observability = ["sentry-sdk[fastapi]>=2.14"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "psycopg[binary]>=3.2",
    "types-redis",
    # FS-005: the PDF text-layer test reads the rendered document back
    "pypdf>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "worker"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The generator scripts predate the lint gate and are not shipped code. dev.py is
# excluded from the exclusion because it is run on every session start. ISS-035.
extend-exclude = [
    "scripts/build_reference_page.py",
    "scripts/generate_api_docs.py",
    "scripts/generate_flows.py",
    "scripts/generate_graph.py",
    "scripts/validate_reference_sql.py",
    # The live drivers are hand-run smoke scripts against a running server: not
    # shipped, not imported, and read by a person watching output scroll past.
    # Same reason as the generators above.
    "scripts/livetest",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["A003"]

[tool.ruff.lint.per-file-ignores]
# `ValidationFailed` is the name the whole codebase and the API contract use, and
# it reads correctly at every call site: `raise ValidationFailed(fields=...)`.
# N818 wants an `Error` suffix. Renaming one class to satisfy a naming rule, across
# every service and every test, buys nothing a reader would notice.
"api/errors.py" = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["api", "worker"]

# Strict where the money is; relaxed at the edges (CLAUDE.md 4.2).
[tool.mypy]
python_version = "3.12"
plugins = []
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["api.domain.*", "api.services.*"]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "db: needs a live Postgres through PgBouncer",
    "rls: asserts a row-level security property, including the negative cases",
    "concurrency: needs two genuinely simultaneous connections",
]
filterwarnings = ["error::DeprecationWarning"]
